services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.10.1
    container_name: meow-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER:-groq}
      - HINDSIGHT_API_LLM_API_KEY=${GROQ_API_KEY:-}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_API_LLM_MODEL:-openai/gpt-oss-20b}
      - HINDSIGHT_API_LLM_GROQ_SERVICE_TIER=${HINDSIGHT_API_LLM_GROQ_SERVICE_TIER:-on_demand}
      - HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS=${HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS:-4096}
      - HINDSIGHT_API_REFLECT_MAX_COMPLETION_TOKENS=${HINDSIGHT_API_REFLECT_MAX_COMPLETION_TOKENS:-2048}
      - HINDSIGHT_API_WORKER_ID=meow-hindsight-worker
    volumes:
      - hindsight-data:/home/hindsight/.pg0
      - ./docker/patches/openai_compatible_llm.py:/app/api/hindsight_api/engine/providers/openai_compatible_llm.py:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8888/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - default

  api:
    build: .
    container_name: support-copilot-api
    command: .venv/bin/python main.py
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - HINDSIGHT_API_URL=http://hindsight:8888
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      default:
        aliases:
          - api
          - support-copilot-api
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base

  dashboard:
    build: .
    container_name: support-copilot-dashboard
    command: .venv/bin/streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base

volumes:
  hindsight-data:

